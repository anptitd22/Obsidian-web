[build]
  command = "npx quartz build"
  publish = "public"

# Tắt toàn bộ can thiệp tự động sửa URL / tối ưu hóa của Netlify
[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

# Xử lý routing tĩnh: đảm bảo file html không bị trả nhầm status redirect
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200

# Trả trang 404 chuẩn của Quartz khi không tìm thấy ghi chú
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404